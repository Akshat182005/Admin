<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        /* ---------- CSS VARIABLES (THEMES) ---------- */
        :root {
            --bg-color: #f4f6f9;
            --text-color: #222;
            --card-bg: #ffffff;
            --sidebar-bg: #1e293b;
            --accent: #2563eb;
        }

        .dark-theme {
            --bg-color: #0f172a;
            --text-color: #e5e7eb;
            --card-bg: #1e293b;
            --sidebar-bg: #020617;
            --accent: #38bdf8;
        }

        /* ---------- GLOBAL STYLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* ---------- GRID LAYOUT ---------- */
        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 60px 1fr;
            height: 100vh;
        }

        header {
            grid-column: 2 / 3;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
        }

        aside {
            grid-row: 1 / 3;
            background: var(--sidebar-bg);
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
            overflow-y: auto;
        }

        /* ---------- SIDEBAR ---------- */
        aside h2 {
            margin-bottom: 30px;
        }

        aside ul {
            list-style: none;
        }

        aside ul li {
            padding: 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        aside ul li:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ---------- CARDS ---------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            color: var(--accent);
        }

        /* ---------- BUTTON ---------- */
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 60px auto 1fr;
            }

            aside {
                grid-row: 2 / 3;
            }

            header {
                grid-column: 1 / 2;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <!-- SIDEBAR -->
        <aside>
            <h2>Admin</h2>
            <ul>
                <li>Dashboard</li>
                <li>Users</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- HEADER -->
        <header>
            <h3>Admin Dashboard</h3>
            <button onclick="toggleTheme()">Toggle Theme</button>
        </header>

        <!-- MAIN CONTENT -->
        <main>
            <div class="cards">
                <div class="card">
                    <h3>Users</h3>
                    <p>1,245 Active Users</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>₹78,000 This Month</p>
                </div>

                <div class="card">
                    <h3>Reports</h3>
                    <p>32 New Reports</p>
                </div>

                <div class="card">
                    <h3>System Status</h3>
                    <p>All Systems Running</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ---------- JAVASCRIPT ---------- -->
    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark-theme");
        }
    </script>
</body>
</html>
